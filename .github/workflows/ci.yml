name: ci
on:
  push:
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: node -v && npm -v
      - run: npm ci --include=optional
      - run: npm run build:core
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
